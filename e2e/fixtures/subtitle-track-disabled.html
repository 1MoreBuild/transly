<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Transly E2E Disabled TextTrack Video</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111318; }
      video { width: 960px; height: 540px; max-width: 90vw; background: #222631; }
    </style>
  </head>
  <body>
    <video id="player" aria-label="Disabled TextTrack test video" src="/subtitle.mp4" muted autoplay loop>
      <track kind="subtitles" srclang="en" label="English" src="/captions.vtt">
    </video>
    <script>
      window.setSubtitleTime = (time) => { document.querySelector("#player").currentTime = time; };
    </script>
  </body>
</html>
