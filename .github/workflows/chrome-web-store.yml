name: Chrome Web Store Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: Upload a package or submit the uploaded draft for review
        required: true
        default: upload
        type: choice
        options:
          - upload
          - submit

permissions:
  contents: read
  id-token: write

jobs:
  upload:
    if: github.event_name == 'push' || inputs.mode == 'upload'
    runs-on: ubuntu-latest
    env:
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CWS_PUBLISHER_ID}"
          test -n "${CWS_EXTENSION_ID}"
          test -n "${{ vars.CWS_GCP_PROJECT_ID }}"
          test -n "${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}"
          test -n "${{ vars.CWS_SERVICE_ACCOUNT }}"

      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          MANIFEST_ID="$(node --input-type=module -e "import c from 'node:crypto';import {extensionManifest as m} from './extension.manifest.mjs';const h=c.createHash('sha256').update(Buffer.from(m.key,'base64')).digest().subarray(0,16);process.stdout.write([...h].map(b=>String.fromCharCode(97+(b>>4),97+(b&15))).join(''))")"
          test "${MANIFEST_ID}" = "${CWS_EXTENSION_ID}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"
          fi

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify product journeys
        shell: bash
        run: |
          set -euo pipefail
          npm test

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: transly-release-e2e-${{ github.run_attempt }}
          path: |
            dist/playwright-report/
            dist/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Package extension
        shell: bash
        run: |
          set -euo pipefail
          npm run package

      - name: Retain release package
        uses: actions/upload-artifact@v7
        with:
          name: transly-${{ github.ref_name }}-${{ github.run_attempt }}
          path: dist/transly-*.zip
          if-no-files-found: error
          retention-days: 30

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.CWS_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload package
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          PACKAGE="dist/transly-${VERSION}.zip"
          UPLOAD_RESPONSE="$(mktemp)"
          STATUS_RESPONSE="$(mktemp)"
          trap 'rm -f "${UPLOAD_RESPONSE}" "${STATUS_RESPONSE}"' EXIT
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --upload-file "${PACKAGE}" \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --header "Content-Type: application/zip" \
            --output "${UPLOAD_RESPONSE}" \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:upload"
          jq . "${UPLOAD_RESPONSE}"

          UPLOAD_STATE="$(jq -r '.uploadState // empty' "${UPLOAD_RESPONSE}")"
          for attempt in $(seq 1 30); do
            case "${UPLOAD_STATE}" in
              SUCCEEDED)
                break
                ;;
              IN_PROGRESS)
                sleep 10
                curl \
                  --fail-with-body \
                  --silent \
                  --show-error \
                  --header "Authorization: Bearer ${ACCESS_TOKEN}" \
                  --output "${STATUS_RESPONSE}" \
                  "https://chromewebstore.googleapis.com/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:fetchStatus"
                jq . "${STATUS_RESPONSE}"
                UPLOAD_STATE="$(jq -r '.lastAsyncUploadState // empty' "${STATUS_RESPONSE}")"
                ;;
              *)
                echo "Chrome Web Store upload failed with state: ${UPLOAD_STATE:-missing}" >&2
                exit 1
                ;;
            esac
          done
          test "${UPLOAD_STATE}" = "SUCCEEDED"

  submit:
    needs: upload
    if: >-
      always() &&
      ((github.event_name == 'push' && needs.upload.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'submit'))
    runs-on: ubuntu-latest
    environment: chrome-web-store
    env:
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
    steps:
      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CWS_PUBLISHER_ID}"
          test -n "${CWS_EXTENSION_ID}"
          test -n "${{ vars.CWS_GCP_PROJECT_ID }}"
          test -n "${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}"
          test -n "${{ vars.CWS_SERVICE_ACCOUNT }}"

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.CWS_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Submit release for review and automatic publishing
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          curl \
            --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"publishType":"DEFAULT_PUBLISH","skipReview":false,"blockOnWarnings":true}' \
            "https://chromewebstore.googleapis.com/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:publish"
